<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Go Musafir — All Punjab Rides</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: #eef1f6; color: #161829; padding-bottom: 40px; }
    header { background: #18182b; color: #fff; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; }
    header p { font-size: 11px; color: #9ea4c4; }
    .hdr-link { background: #292a45; color: #fff; text-decoration: none; padding: 7px 11px; border-radius: 10px; font-size: 12px; font-weight: 700; }
    .wrap { max-width: 490px; margin: 14px auto; padding: 0 12px; }
    .sheet { background: #fff; border-radius: 20px; padding: 18px; margin-bottom: 14px; border: 1px solid #e3e7f0; }
    label { display: block; font-size: 11px; font-weight: 800; margin: 10px 0 5px; }
    input { width: 100%; padding: 12px; border: 1.5px solid #dce1ed; border-radius: 12px; font-size: 14px; }
    .btn { width: 100%; border: none; border-radius: 12px; padding: 13px; font-size: 14px; font-weight: 800; cursor: pointer; margin-top: 12px; }
    .btn-primary { background: #18182b; color: #fff; }
    .btn-mint { background: #0fa968; color: #fff; }
    .btn-coral { background: #ff5a36; color: #fff; }
    .btn-soft { background: #edf0f7; color: #18182b; }
    .msg { margin-top: 10px; font-size: 12px; font-weight: 700; color: #0fa968; }
    .hide { display: none; }
    .ride-box { border: 1px solid #dce1ed; border-radius: 14px; padding: 12px; margin-top: 10px; background: #fafbfe; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Go Musafir</h1>
      <p>Cloud Live • v34</p>
    </div>
    <a class="hdr-link" href="driver.html">Driver App</a>
  </header>

  <div class="wrap">
    <div id="login-card" class="sheet">
      <h2>Sign in to Go Musafir</h2>
      <p style="font-size:12px;color:#676e8a;margin-top:4px;">All 23 districts of Punjab</p>

      <div id="step-phone">
        <label for="phone-inp">Mobile Number</label>
        <input id="phone-inp" type="tel" value="+918564885647" />
        <button type="button" id="btn-send-otp" class="btn btn-primary">Send OTP</button>
      </div>

      <div id="step-otp" class="hide">
        <label for="otp-inp">Enter 6-Digit OTP</label>
        <input id="otp-inp" type="text" maxlength="6" value="123456" />
        <button type="button" id="btn-verify-otp" class="btn btn-mint">Verify & Continue</button>
        <button type="button" id="btn-back-phone" class="btn btn-soft">Change Number</button>
      </div>

      <div id="login-msg" class="msg"></div>
    </div>

    <div id="app-card" class="sheet hide">
      <h2>Book Ride (Punjab)</h2>
      <label for="pickup-inp">Pickup</label>
      <input id="pickup-inp" type="text" value="Threeke, Ludhiana" />
      <label for="drop-inp">Drop</label>
      <input id="drop-inp" type="text" value="Jalandhar" />
      <button type="button" id="btn-book-ride" class="btn btn-coral">Book Ride • ₹500</button>
      <div id="book-msg" class="msg"></div>
      <div id="rides-list" style="margin-top:12px;"></div>
    </div>
  </div>

  <script>
    var rides = [];

    function openOtpBox() {
      var p = document.getElementById("step-phone");
      var o = document.getElementById("step-otp");
      var inp = document.getElementById("otp-inp");
      var m = document.getElementById("login-msg");
      if (p) p.classList.add("hide");
      if (o) o.classList.remove("hide");
      if (inp) inp.value = "123456";
      if (m) m.textContent = "OTP 123456 sent.";
    }

    function backToPhoneBox() {
      var p = document.getElementById("step-phone");
      var o = document.getElementById("step-otp");
      var m = document.getElementById("login-msg");
      if (o) o.classList.add("hide");
      if (p) p.classList.remove("hide");
      if (m) m.textContent = "";
    }

    function openBookingScreen() {
      var l = document.getElementById("login-card");
      var a = document.getElementById("app-card");
      if (l) l.classList.add("hide");
      if (a) a.classList.remove("hide");
      renderRides();
    }

    function renderRides() {
      var box = document.getElementById("rides-list");
      if (!box) return;
      if (!rides.length) {
        box.innerHTML = "<p style='font-size:12px;color:#676e8a;'>No rides yet.</p>";
        return;
      }
      var out = "";
      for (var i = 0; i < rides.length; i++) {
        var r = rides[i];
        out += "<div class='ride-box'><strong>" + r.id + "</strong> • " + r.pickup + " → " + r.drop + "<br><span style='font-size:12px;'>PIN: <strong>" + r.pin + "</strong> • Status: " + r.status + "</span></div>";
      }
      box.innerHTML = out;
    }

    function createRide() {
      var p = (document.getElementById("pickup-inp").value || "Threeke, Ludhiana").trim();
      var d = (document.getElementById("drop-inp").value || "Jalandhar").trim();
      var rideObj = {
        id: "GM" + Math.floor(100 + Math.random() * 900),
        pin: String(Math.floor(1000 + Math.random() * 9000)),
        pickup: p,
        drop: d,
        status: "Searching Driver"
      };
      rides.unshift(rideObj);
      try { localStorage.setItem("gm_shared_rides_v1", JSON.stringify(rides)); } catch (e) {}
      if (typeof window.gmPushRidesToCloud === "function") {
        window.gmPushRidesToCloud(rides);
      }
      document.getElementById("book-msg").textContent = "Ride booked: " + rideObj.id;
      renderRides();
    }

    document.getElementById("btn-send-otp").addEventListener("click", openOtpBox);
    document.getElementById("btn-verify-otp").addEventListener("click", openBookingScreen);
    document.getElementById("btn-back-phone").addEventListener("click", backToPhoneBox);
    document.getElementById("btn-book-ride").addEventListener("click", createRide);

    try {
      var saved = JSON.parse(localStorage.getItem("gm_shared_rides_v1") || "[]");
      if (Array.isArray(saved)) rides = saved;
    } catch (e) {}
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    try {
      var firebaseConfig = {
        apiKey: "AIzaSyC0OP0etTxACa4fMAxbhz_fjDv00-syZfws",
        authDomain: "musafir-2016d.firebaseapp.com",
        projectId: "musafir-2016d",
        storageBucket: "musafir-2016d.firebasestorage.app",
        messagingSenderId: "649368739510",
        appId: "1:649368739510:web:6bfcfecd5d663d9430d017"
      };
      var app = initializeApp(firebaseConfig);
      var db = getFirestore(app);
      var ridesDocRef = doc(db, "gm_cloud", "shared_rides");

      window.gmPushRidesToCloud = function (list) {
        setDoc(ridesDocRef, { list: list, updatedAt: Date.now() }).catch(function () {});
      };

      onSnapshot(ridesDocRef, function (snap) {
        if (snap.exists() && Array.isArray(snap.data().list)) {
          rides = snap.data().list;
          try { localStorage.setItem("gm_shared_rides_v1", JSON.stringify(rides)); } catch (e) {}
          renderRides();
        }
      });
    } catch (e) {}
  </script>
</body>
</html>
