name: Build Dastak Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "capacitor.config.json"
      - ".github/workflows/build-android.yml"

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare webDir and initialize Capacitor Android
        run: |
          mkdir -p www
          echo "<html><body><script>window.location.replace('https://ludhianawalle76000-create.github.io/musafir-aap/dastak.html');</script></body></html>" > www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap add android

      - name: Add FLAG_SECURE to MainActivity.java
        run: |
          MAIN_JAVA=$(find android/app/src/main/java -name "MainActivity.java" | head -n 1)
          cat << 'EOF' > "$MAIN_JAVA"
          package com.dastak.app;

          import android.os.Bundle;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              getWindow().setFlags(
                WindowManager.LayoutParams.FLAG_SECURE,
                WindowManager.LayoutParams.FLAG_SECURE
              );
            }
          }
          EOF

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dastak-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
