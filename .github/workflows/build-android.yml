name: Build Dastak Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "capacitor.config.json"
      - ".github/workflows/build-android.yml"
      - "1795725722954.png"

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: "platforms;android-34 build-tools;34.0.0"

      - name: Prepare webDir and initialize Capacitor Android
        run: |
          mkdir -p www
          echo "<html><body><script>window.location.replace('https://ludhianawalle76000-create.github.io/musafir-aap/dastak.html');</script></body></html>" > www/index.html
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap add android --name "Dastak The Real Connections" --app-id "com.dastak.app" || npx cap add android

      - name: Apply Dastak App Name and Icon
        run: |
          pip install Pillow
          python3 -c '
          from PIL import Image
          import os, glob, xml.etree.ElementTree as ET

          for strings_path in glob.glob("android/app/src/main/res/values*/strings.xml"):
              tree = ET.parse(strings_path)
              root = tree.getroot()
              for elem in root.findall("string"):
                  if elem.get("name") in ["app_name", "title_activity_main", "custom_url_scheme"]:
                      elem.text = "Dastak The Real Connections"
              tree.write(strings_path, encoding="utf-8", xml_declaration=True)

          icon_candidates = ["1795725722954.png", "assets/dastak-icon.png", "1795639460501.png", "1003407090.png"]
          src_path = next((p for p in icon_candidates if os.path.exists(p)), None)
          if src_path:
              src = Image.open(src_path).convert("RGBA")
              sizes = {
                  "mipmap-mdpi": 48,
                  "mipmap-hdpi": 72,
                  "mipmap-xhdpi": 96,
                  "mipmap-xxhdpi": 144,
                  "mipmap-xxxhdpi": 192,
              }
              res_root = "android/app/src/main/res"
              for folder, px in sizes.items():
                  out_dir = os.path.join(res_root, folder)
                  os.makedirs(out_dir, exist_ok=True)
                  resized = src.resize((px, px), Image.Resampling.LANCZOS)
                  for fname in ["ic_launcher.png", "ic_launcher_round.png", "ic_launcher_foreground.png"]:
                      resized.save(os.path.join(out_dir, fname))
          '

      - name: Add FLAG_SECURE to MainActivity.java
        run: |
          MAIN_JAVA=$(find android/app/src/main/java -name "MainActivity.java" | head -n 1)
          cat << 'EOF' > "$MAIN_JAVA"
          package com.dastak.app;

          import android.os.Bundle;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              getWindow().setFlags(
                WindowManager.LayoutParams.FLAG_SECURE,
                WindowManager.LayoutParams.FLAG_SECURE
              );
            }
          }
          EOF

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dastak-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
