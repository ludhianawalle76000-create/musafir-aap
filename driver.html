<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Go Musafir Partner — Driver App</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@600;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
    body { background: #eef1f6; color: #161829; padding-bottom: 84px; }
    .mono { font-family: 'JetBrains Mono', monospace; }

    header { background: #18182b; color: #fff; padding: 14px 16px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 60; }
    header h1 { font-size: 17px; font-weight: 800; letter-spacing: -0.3px; }
    header p { font-size: 11px; color: #9ea4c4; }
    .hdr-right { display: flex; align-items: center; gap: 8px; }
    .duty-btn { border: none; border-radius: 999px; padding: 7px 12px; font-size: 11px; font-weight: 800; cursor: pointer; background: #0fa968; color: #fff; }
    .duty-btn.off { background: #ff5a36; color: #fff; }
    .hdr-link { background: #292a45; color: #fff; text-decoration: none; border: 1px solid #3f426b; padding: 7px 11px; border-radius: 10px; font-size: 12px; font-weight: 700; }

    .wrap { max-width: 490px; margin: 14px auto; padding: 0 12px; }
    .sheet { background: #fff; border-radius: 22px; padding: 18px; margin-bottom: 14px; box-shadow: 0 10px 28px rgba(24, 24, 43, 0.07); border: 1px solid #e3e7f0; }
    h2 { font-size: 18px; font-weight: 800; color: #18182b; margin-bottom: 4px; letter-spacing: -0.3px; }
    .sub { font-size: 12px; color: #676e8a; margin-bottom: 12px; }
    label { display: block; font-size: 11px; font-weight: 800; color: #474d6b; text-transform: uppercase; letter-spacing: 0.4px; margin: 12px 0 5px; }
    input, textarea, select { width: 100%; padding: 12px 13px; border: 1.5px solid #dce1ed; border-radius: 12px; font-size: 14px; background: #f9fafd; color: #161829; }
    input:focus, textarea:focus, select:focus { outline: none; border-color: #18182b; background: #fff; }

    .btn { width: 100%; border: none; border-radius: 12px; padding: 12px; font-size: 13px; font-weight: 800; cursor: pointer; transition: transform 0.1s; }
    .btn:active { transform: scale(0.99); }
    .btn-primary { background: #18182b; color: #fff; }
    .btn-mint { background: #0fa968; color: #fff; }
    .btn-coral { background: #ff5a36; color: #fff; }
    .btn-indigo { background: #3444b8; color: #fff; }
    .btn-soft { background: #edf0f7; color: #18182b; }

    .ride-card { border: 1.5px solid #e3e7f0; border-radius: 18px; padding: 14px; margin-top: 12px; background: #fff; box-shadow: 0 6px 18px rgba(24, 24, 43, 0.04); }
    .rc-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .rc-title { font-size: 13px; font-weight: 800; color: #18182b; }
    .rc-badge { font-size: 11px; padding: 3px 9px; border-radius: 999px; background: #e1f7ed; color: #0b7a4b; font-weight: 800; }
    .rc-route { font-size: 12px; color: #474d6b; margin-top: 4px; font-weight: 600; }

    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    .pin-start-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; align-items: center; }

    .nav-box { margin-top: 10px; border-radius: 14px; overflow: hidden; border: 1.5px solid #dce1ed; background: #f8f9fc; }
    .nav-map-el { height: 185px; width: 100%; background: #e8eef7; }
    .nav-ft { padding: 9px 10px; display: flex; justify-content: space-between; align-items: center; gap: 6px; flex-wrap: wrap; background: #f4f6fb; border-top: 1px solid #e3e7f0; }
    .nav-lbl { font-size: 11px; font-weight: 800; color: #18182b; }
    .nav-btns { display: flex; gap: 6px; }
    .nav-mini { background: #fff; border: 1.5px solid #cfd6e6; color: #18182b; padding: 6px 10px; border-radius: 9px; font-size: 11px; font-weight: 800; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
    .nav-mini:hover { background: #18182b; color: #fff; border-color: #18182b; }

    .wallet-box { background: linear-gradient(135deg, #18182b, #2b2d52); color: #fff; border-radius: 16px; padding: 16px; margin-bottom: 12px; }
    .w-amt { font-size: 26px; font-weight: 800; color: #4ef0a8; margin-top: 4px; }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #ffffff;
      border-top: 1px solid #dce1ed;
      padding: 8px 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      z-index: 500;
      box-shadow: 0 -4px 16px rgba(24, 24, 43, 0.08);
    }
    .bottom-nav button,
    .nav-tab-btn {
      flex: 1;
      background: #f3f5fa;
      color: #18182b;
      border: 1.5px solid #d5dbe8;
      border-radius: 12px;
      padding: 10px 8px;
      font-size: 12px;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }
    .bottom-nav button.active,
    .nav-tab-btn.active {
      background: #18182b;
      color: #ffffff;
      border-color: #18182b;
      box-shadow: 0 4px 10px rgba(24, 24, 43, 0.2);
    }

    .msg { margin-top: 8px; font-size: 12px; font-weight: 700; color: #0fa968; min-height: 16px; }
    .hide { display: none !important; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Go Musafir Partner</h1>
      <p>Cloud Live • v31</p>
    </div>
    <div class="hdr-right">
      <button type="button" id="duty-toggle-btn" class="duty-btn" onclick="toggleDuty()">ON DUTY</button>
      <a class="hdr-link" href="index.html">Passenger</a>
    </div>
  </header>

  <div class="wrap">
    <!-- HOME TAB -->
    <div id="tab-home">
      <div class="sheet">
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <div>
            <h2 style="margin-bottom:2px;">Live Ride Requests</h2>
            <p class="sub" style="margin-bottom:0;">Accept rides, verify 4-digit PIN & navigate across Punjab.</p>
          </div>
          <button type="button" class="nav-mini" onclick="renderDriverRides()">Refresh</button>
        </div>
        <div id="driver-rides-list"></div>
      </div>
    </div>

    <!-- ORDERS & WALLET TAB -->
    <div id="tab-orders" class="hide">
      <div class="sheet">
        <h2>Driver Wallet & Earnings</h2>
        <p class="sub">Track completed trips and wallet balance.</p>
        <div class="wallet-box">
          <div style="font-size:11px;font-weight:800;color:#9ea4c4;letter-spacing:0.5px;">PARTNER EARNINGS WALLET</div>
          <div id="d-wallet-bal" class="w-amt mono">₹0</div>
        </div>
        <div id="completed-orders-list"></div>
      </div>
    </div>

    <!-- MY PROFILE TAB -->
    <div id="tab-profile" class="hide">
      <div class="sheet">
        <h2>Partner Profile</h2>
        <p class="sub">Update your name, vehicle number & category.</p>

        <label for="d-name">Driver Name</label>
        <input id="d-name" type="text" placeholder="e.g., Harvinder Singh" />

        <label for="d-phone">Mobile Number</label>
        <input id="d-phone" type="tel" value="+918564885647" />

        <label for="d-vehicle">Vehicle Type</label>
        <select id="d-vehicle">
          <option value="Bike">Musafir Bike</option>
          <option value="E-Rickshaw">E-Rickshaw</option>
          <option value="Cab">Musafir Cab</option>
        </select>

        <label for="d-plate">Vehicle Number</label>
        <input id="d-plate" type="text" placeholder="e.g., PB 10 XX 1234" />

        <button type="button" class="btn btn-primary" style="margin-top:14px;" onclick="saveDriverProfile()">Save Profile</button>
        <div id="d-profile-msg" class="msg"></div>
      </div>
    </div>
  </div>

  <!-- BOTTOM NAVIGATION (ALL BOXED) -->
  <nav class="bottom-nav" aria-label="Driver Navigation">
    <button type="button" id="nav-home" class="nav-tab-btn active" onclick="switchDriverTab('home')">Home</button>
    <button type="button" id="nav-orders" class="nav-tab-btn" onclick="switchDriverTab('orders')">Orders & Wallet</button>
    <button type="button" id="nav-profile" class="nav-tab-btn" onclick="switchDriverTab('profile')">My Profile</button>
  </nav>

  <script>
    var rides = [];
    var onDuty = true;
    var dMaps = {};

    function dEl(id) { return document.getElementById(id); }

    function switchDriverTab(tab) {
      ["home", "orders", "profile"].forEach(function (t) {
        var sec = dEl("tab-" + t);
        var btn = dEl("nav-" + t);
        if (sec) {
          if (t === tab) sec.classList.remove("hide");
          else sec.classList.add("hide");
        }
        if (btn) {
          if (t === tab) btn.classList.add("active");
          else btn.classList.remove("active");
        }
      });
      if (tab === "home") {
        renderDriverRides();
      } else if (tab === "orders") {
        renderOrdersAndWallet();
      }
    }

    function toggleDuty() {
      onDuty = !onDuty;
      var btn = dEl("duty-toggle-btn");
      if (!btn) return;
      if (onDuty) {
        btn.textContent = "ON DUTY";
        btn.classList.remove("off");
      } else {
        btn.textContent = "OFF DUTY";
        btn.classList.add("off");
      }
    }

    function syncRides() {
      try { localStorage.setItem("gm_shared_rides_v1", JSON.stringify(rides)); } catch (e) {}
      if (typeof window.gmPushRidesToCloud === "function") {
        try { window.gmPushRidesToCloud(rides); } catch (e) {}
      }
    }

    function acceptRide(idx) {
      if (!rides[idx]) return;
      rides[idx].status = "Accepted";
      syncRides();
      renderDriverRides();
    }

    function arriveAtPickup(idx) {
      if (!rides[idx]) return;
      rides[idx].status = "Arrived at Customer Location";
      syncRides();
      renderDriverRides();
    }

    function startRideWithPin(idx) {
      var r = rides[idx];
      if (!r) return;
      var inp = dEl("pin-inp-" + idx);
      var entered = inp ? inp.value.trim() : "";
      var expected = String(r.rideOtp || r.pin || "");
      if (!expected || entered === expected) {
        r.status = "Ride Started";
        syncRides();
        renderDriverRides();
      } else {
        alert("Wrong 4-Digit PIN! Passenger se sahi PIN confirm karein.");
      }
    }

    function completeTrip(idx) {
      if (!rides[idx]) return;
      rides[idx].status = "Completed";
      syncRides();
      renderDriverRides();
      renderOrdersAndWallet();
    }

    function initDriverRideMap(idx, r) {
      try {
        var elId = "d-nav-map-" + idx;
        var el = dEl(elId);
        if (!el || typeof L === "undefined") return;
        if (dMaps[idx]) { dMaps[idx].remove(); delete dMaps[idx]; }

        var pLat = typeof r.pLat === "number" ? r.pLat : 30.8615;
        var pLng = typeof r.pLng === "number" ? r.pLng : 75.8150;
        var dLat = typeof r.dLat === "number" ? r.dLat : 30.9120;
        var dLng = typeof r.dLng === "number" ? r.dLng : 75.8540;

        var map = L.map(elId, { zoomControl: true }).setView([pLat, pLng], 12);
        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          maxZoom: 19,
          attribution: "&copy; OSM"
        }).addTo(map);
        L.polyline([[pLat, pLng], [dLat, dLng]], { color: "#18182b", weight: 4 }).addTo(map);
        L.circleMarker([pLat, pLng], { radius: 7, color: "#0fa968", fillColor: "#0fa968", fillOpacity: 1 }).addTo(map);
        L.circleMarker([dLat, dLng], { radius: 7, color: "#ff5a36", fillColor: "#ff5a36", fillOpacity: 1 }).addTo(map);
        map.fitBounds([[pLat, pLng], [dLat, dLng]], { padding: [20, 20] });
        dMaps[idx] = map;
      } catch (e) {}
    }

    function renderDriverRides() {
      var box = dEl("driver-rides-list");
      if (!box) return;
      if (!rides.length) {
        box.innerHTML = "<p class='sub' style='margin-top:12px;'>Abhi koi live ride request nahi hai.</p>";
        return;
      }

      var html = "";
      for (var i = 0; i < rides.length; i++) {
        var r = rides[i] || {};
        var st = String(r.status || "Searching Driver");
        var pLat = typeof r.pLat === "number" ? r.pLat : 30.8615;
        var pLng = typeof r.pLng === "number" ? r.pLng : 75.8150;
        var gMapsUrl = "https://www.google.com/maps/dir/?api=1&destination=" + pLat + "," + pLng;

        html += '<div class="ride-card">' +
          '<div class="rc-top">' +
            '<div class="rc-title mono">' + (r.km || 0) + ' km • ₹' + (r.total || 0) + ' • ' + (r.payMode || "Cash") + '</div>' +
            '<span class="rc-badge">' + st + '</span>' +
          '</div>' +
          '<div class="rc-route">' + (r.pickup || "Pickup") + ' → ' + (r.drop || "Drop") + '</div>' +
          '<div class="grid2">' +
            '<button type="button" class="btn btn-coral" onclick="acceptRide(' + i + ')">Accept Ride</button>' +
            '<button type="button" class="btn btn-indigo" onclick="arriveAtPickup(' + i + ')">Arrived at Pickup</button>' +
          '</div>' +
          '<div class="pin-start-row">' +
            '<input id="pin-inp-' + i + '" class="mono" type="text" maxlength="4" placeholder="4-Digit PIN" />' +
            '<button type="button" class="btn btn-mint" onclick="startRideWithPin(' + i + ')">Start Ride</button>' +
          '</div>' +
          '<button type="button" class="btn btn-primary" style="margin-top:8px;" onclick="completeTrip(' + i + ')">Complete Trip</button>' +
          '<div class="nav-box">' +
            '<div id="d-nav-map-' + i + '" class="nav-map-el"></div>' +
            '<div class="nav-ft">' +
              '<span class="nav-lbl">All Punjab Live Navigation</span>' +
              '<div class="nav-btns">' +
                '<button type="button" class="nav-mini" onclick="initDriverRideMap(' + i + ', rides[' + i + '])">Navigate on Map</button>' +
                '<a class="nav-mini" href="' + gMapsUrl + '" target="_blank" rel="noopener">Google Maps</a>' +
              '</div>' +
            '</div>' +
          '</div>' +
        '</div>';
      }

      box.innerHTML = html;
      for (var m = 0; m < rides.length; m++) {
        initDriverRideMap(m, rides[m] || {});
      }
    }

    function renderOrdersAndWallet() {
      var listEl = dEl("completed-orders-list");
      var balEl = dEl("d-wallet-bal");
      var earned = 0;
      var html = "";

      for (var i = 0; i < rides.length; i++) {
        var r = rides[i] || {};
        if (String(r.status || "").toLowerCase().indexOf("complet") !== -1) {
          earned += Number(r.total || 0);
          html += '<div class="ride-card">' +
            '<div class="rc-top">' +
              '<span class="rc-title">' + (r.v || "Ride") + ' • <span class="mono">₹' + (r.total || 0) + '</span></span>' +
              '<span class="rc-badge">Completed</span>' +
            '</div>' +
            '<div class="rc-route">' + (r.pickup || "Pickup") + ' → ' + (r.drop || "Drop") + '</div>' +
          '</div>';
        }
      }

      if (balEl) balEl.textContent = "₹" + earned;
      if (listEl) {
        listEl.innerHTML = html || "<p class='sub'>Abhi koi completed order nahi hai.</p>";
      }
    }

    function saveDriverProfile() {
      try {
        var prof = {
          name: dEl("d-name") ? dEl("d-name").value.trim() : "",
          phone: dEl("d-phone") ? dEl("d-phone").value.trim() : "",
          vehicle: dEl("d-vehicle") ? dEl("d-vehicle").value : "Bike",
          plate: dEl("d-plate") ? dEl("d-plate").value.trim() : ""
        };
        localStorage.setItem("gm_driver_profile_v1", JSON.stringify(prof));
        if (dEl("d-profile-msg")) dEl("d-profile-msg").textContent = "Profile saved!";
      } catch (e) {}
    }

    function loadDriverProfile() {
      try {
        var raw = localStorage.getItem("gm_driver_profile_v1");
        if (!raw) return;
        var prof = JSON.parse(raw);
        if (dEl("d-name") && prof.name) dEl("d-name").value = prof.name;
        if (dEl("d-phone") && prof.phone) dEl("d-phone").value = prof.phone;
        if (dEl("d-vehicle") && prof.vehicle) dEl("d-vehicle").value = prof.vehicle;
        if (dEl("d-plate") && prof.plate) dEl("d-plate").value = prof.plate;
      } catch (e) {}
    }

    try {
      var saved = JSON.parse(localStorage.getItem("gm_shared_rides_v1") || "[]");
      if (Array.isArray(saved)) rides = saved;
    } catch (e) {}

    window.addEventListener("DOMContentLoaded", function () {
      loadDriverProfile();
      renderDriverRides();
      renderOrdersAndWallet();
    });
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    try {
      var firebaseConfig = {
        apiKey: "AIzaSyC0OP0etTxACa4fMAxbhz_fjDv00-syZfws",
        authDomain: "musafir-2016d.firebaseapp.com",
        projectId: "musafir-2016d",
        storageBucket: "musafir-2016d.firebasestorage.app",
        messagingSenderId: "649368739510",
        appId: "1:649368739510:web:6bfcfecd5d663d9430d017"
      };
      var app = initializeApp(firebaseConfig);
      var db = getFirestore(app);
      var ridesDocRef = doc(db, "gm_cloud", "shared_rides");

      window.gmPushRidesToCloud = function (list) {
        setDoc(ridesDocRef, { list: list, updatedAt: Date.now() }).catch(function () {});
      };

      onSnapshot(ridesDocRef, function (snap) {
        if (snap.exists() && Array.isArray(snap.data().list)) {
          rides = snap.data().list;
          try { localStorage.setItem("gm_shared_rides_v1", JSON.stringify(rides)); } catch (e) {}
          renderDriverRides();
          renderOrdersAndWallet();
        }
      });
    } catch (e) {}
  </script>
</body>
</html>
